[workspace]
resolver = "3"
members = ["drevo", "drevo-macros"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ElectricPulse/drevo"
readme = "README.md"

[workspace.dependencies]
derive-where = "1.6.1"

[workspace.lints.rust]
unused_must_use = "warn"
unused_results = "warn"
