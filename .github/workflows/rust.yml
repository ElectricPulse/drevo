name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install Fontconfig development files
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev
      - name: Build workspace
        run: cargo +nightly build --workspace --all-targets
      - name: Test workspace
        run: cargo +nightly test --workspace
