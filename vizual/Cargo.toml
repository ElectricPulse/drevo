[package]
name = "vizual"
version = "0.1.0"
edition = "2024"
description = "An async, solver-driven desktop UI framework rendered with Vello"
repository = "https://github.com/ElectricPulse/vizual"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
derive-where.workspace = true
ambassador = "0.5.0"
async-trait = "0.1.89"
vizual-macros = { path = "../vizual-macros" }
tokio = { version = "1.48.0", features = ["full"] }
color-eyre = "0.6.5"
derive-new = "0.7.0"
delegate = "0.13.5"
dyn-clone = "1.0.20"
async-recursion = "1.1.1"
futures = "0.3.32"
highs = "2.4.0"
highs-sys = "1.15.0"
log = "0.4.29"
simplelog = "0.12.2"
time = { version = "0.3.47", features = ["formatting"] }
uuid = { version = "1.23.1", features = ["v4"] }
unit-intervals = "0.1.0"
uniqify = "0.1.0"
parley = "0.11.0"
lucide-icons = "1.28.0"
skrifa = "0.42.1"
pollster = "1.0.1"
vello = "0.9.0"
winit = "0.30.12"

[lints]
workspace = true
